<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Stock</title>
<style>
:root{
  --navy:#0a1a3a; --navy2:#102a5c; --blue:#2563eb; --green:#12a150; --orange:#f59e0b; --red:#ef4444; --purple:#8b5cf6;
  --bg:#f1f5fb; --card:#fff; --ink:#0f1f3d; --muted:#64748b; --line:#e3e9f3;
  --shadow:0 1px 3px rgba(15,31,61,.06),0 4px 14px rgba(15,31,61,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px;line-height:1.4}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside.side{background:linear-gradient(180deg,var(--navy) 0%,#0b2250 60%,#0d2a5e 100%);color:#fff;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 18px}
.logo{width:42px;height:42px;border-radius:10px;border:2px solid #22d3a0;display:grid;place-items:center;color:#22d3a0}
.brand b{font-size:19px;display:block;line-height:1.1}
.brand span{font-size:12px;opacity:.8}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:#dbe6ff;text-decoration:none;cursor:pointer;margin-bottom:3px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:var(--blue);color:#fff}
nav a .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:12px;padding:1px 8px;font-weight:700}
nav a.gi svg{color:#34d399} nav a.go svg{color:#fb7185}
.sync-card{margin-top:auto;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px;background:rgba(255,255,255,.05);font-size:13px}
.sync-card .r{display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex:none}
.dot.ok{background:#22c55e;animation:pulse 2s infinite}.dot.err{background:#f87171}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.sync-card button{margin-top:10px;width:100%;background:transparent;border:1px solid #3b82f6;color:#bcd2ff;border-radius:8px;padding:8px;cursor:pointer;font-weight:600}

.top{display:flex;gap:14px;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.burger{display:none;background:none;border:0;cursor:pointer;padding:4px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#f7f9fd;border-radius:9px;padding:8px 12px;color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.top .sp{flex:1}
.ibtn{position:relative;background:none;border:0;cursor:pointer;color:#475569;padding:6px;border-radius:8px}
.ibtn.on{background:#fee2e2;color:var(--red)}
.ibtn .n{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:0 5px}
.topsync{display:flex;gap:8px;align-items:center;font-size:13px}
.topsync b{display:block;color:var(--green)} .topsync.err b{color:var(--red)} .topsync.local b{color:var(--muted)}
.topsync small{color:var(--muted)}
.clock{font-size:13px;color:#475569;text-align:right}

.content{padding:20px 24px 40px;max-width:1640px}
.col .hero{margin-bottom:0}
h1.page{margin:0;font-size:26px} .sub{color:var(--muted);margin:2px 0 16px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:16px}
.link{color:var(--blue);font-size:12px;cursor:pointer;font-weight:600;background:none;border:0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.head h3{margin:0}

.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.banner{background:linear-gradient(100deg,#133a73,#1c4f94 50%,#4a6f98);color:#fff;border-radius:12px;padding:16px 22px;min-width:340px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;right:0;top:0;bottom:0;width:38%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 6px,transparent 6px 22px),repeating-linear-gradient(0deg,rgba(255,255,255,.1) 0 4px,transparent 4px 18px);opacity:.5}
.banner b{display:block;font-size:15px} .banner small{opacity:.85}

#bigalert{display:none;margin-bottom:0;border-radius:12px;padding:12px 16px;background:var(--red);color:#fff;font-weight:600;align-items:center;gap:12px}
#bigalert.show{display:flex;animation:blink 1.4s steps(2,jump-none) infinite}
#bigalert.low{background:var(--orange)}
#bigalert small{display:block;font-weight:400;opacity:.95}
@keyframes blink{50%{filter:brightness(1.18)}}

.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border-radius:12px;padding:14px;border:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;position:relative}
.kpi .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.kpi .l{font-size:13px;color:#475569;font-weight:600} .kpi .v{font-size:28px;font-weight:700;line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.b{background:#eaf2ff}.kpi.b .ic{background:var(--blue)}
.kpi.g{background:#e7f8ee}.kpi.g .ic{background:var(--green)}
.kpi.o{background:#fff3df}.kpi.o .ic{background:var(--orange)}.kpi.o .l{color:#b45309}
.kpi.r{background:#ffe9e9}.kpi.r .ic{background:var(--red)}.kpi.r .l{color:#b91c1c}
.kpi.p{background:#f3ecff}.kpi.p .ic{background:var(--purple)}
.kpi.hot.o .v{color:#d97706}.kpi.hot.r .v{color:var(--red);animation:blink 1.4s steps(2,jump-none) infinite}
.kpi .bar{position:absolute;left:14px;right:14px;bottom:10px;height:5px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden}
.kpi .bar i{display:block;height:100%}
.kpi.has-bar{padding-bottom:26px}
.kpis3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpis3 .kpi .ic{border-radius:50%;width:40px;height:40px}

.charts{display:grid;grid-template-columns:250px minmax(0,1fr) 230px;gap:12px}
.donutwrap{position:relative;width:150px;height:150px;margin:0 auto 8px}
.donutwrap svg{width:150px;height:150px}
.donutwrap .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--muted)}
.donutwrap .mid b{font-size:24px;color:var(--ink);display:block}
.legend{font-size:13px}.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.legend i{width:9px;height:9px;border-radius:50%} .legend span{margin-left:auto;color:var(--muted)}
.cats .row{margin-bottom:11px;font-size:13px}.cats .row div.t{display:flex;justify-content:space-between}
.cats .tr{height:7px;background:#e7edf6;border-radius:4px;margin-top:3px;overflow:hidden}.cats .tr i{display:block;height:100%}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted)}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f3f6fb;color:#334155;text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto}
.pill{display:inline-block;padding:3px 12px;border-radius:7px;font-size:12px;font-weight:600}
.pill.out{background:#ffe3e3;color:#c92a2a}.pill.low{background:#fff0cf;color:#b45309}
.pill.ok{background:#dcf7e6;color:#0f8a43}.pill.over{background:#e5eaff;color:#4338ca}
.pill.in{background:#dcf7e6;color:#0f8a43}.pill.outm{background:#ffe3e3;color:#c92a2a}
.n-out{color:var(--red);font-weight:700}.n-low{color:#d97706;font-weight:700}.n-ok{color:var(--green);font-weight:700}.n-over{color:#4338ca;font-weight:700}
.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;color:#fff;font-weight:700;font-size:12px;margin-right:8px;vertical-align:middle}

.alist .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:8px}
.alist .it.out{background:#ffecec}.alist .it.low{background:#fff4e0}.alist .it.over{background:#e9f8ee}
.alist .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.alist .c svg{width:16px;height:16px}
.alist .out .c{background:var(--red)}.alist .low .c{background:var(--orange)}.alist .over .c{background:var(--green)}
.alist b{display:block;font-size:13.5px}.alist small{font-size:12px}
.alist .out small{color:var(--red)}.alist .low small{color:#d97706}.alist .over small{color:var(--green)}
.alist .r{margin-left:auto;font-size:12px;text-align:right;white-space:nowrap}
.cnt{background:var(--red);color:#fff;border-radius:20px;font-size:12px;padding:1px 8px;margin-left:6px}
.ev{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .c{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.ev .c svg{width:16px;height:16px}
.ev .c.in{background:var(--green)}.ev .c.out{background:var(--orange)}
.ev b{display:block;font-size:13.5px}.ev small{color:var(--muted);font-size:12px}
.ev .r{margin-left:auto;text-align:right}.ev .r b{font-size:13.5px}
.ev .r b.in{color:var(--green)}.ev .r b.out{color:var(--red)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{border:0;border-radius:10px;padding:14px;color:#fff;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:center;text-align:left}
.qbtn small{display:block;font-weight:400;opacity:.9;font-size:11px}
.qbtn.g{background:linear-gradient(135deg,#12a150,#0e8a43)}.qbtn.r{background:linear-gradient(135deg,#f25555,#e03a3a)}

.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}.btn.full{width:100%;padding:13px}
.btn:hover{filter:brightness(1.08)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
label i{color:var(--red);font-style:normal}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d6deec;border-radius:8px;background:#fff}
input[readonly]{background:#f3f6fb}
textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sumrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sumrow:last-of-type{border-bottom:0}
.sumrow.big{font-size:18px;font-weight:700}
.note{border-radius:9px;padding:11px 13px;font-size:13px;margin-top:12px;background:#e8f7ef;color:#0f6a3a}
.note.warn{background:#fff1d6;color:#a15207}.note.bad{background:#ffe3e3;color:#b42323}
.itemhead{display:flex;gap:10px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.msg{margin-top:10px;font-weight:600;min-height:20px}

.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;color:#475569}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bar-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar-tools input,.bar-tools select{width:auto;min-width:160px;flex:1}
.empty{padding:26px;text-align:center;color:var(--muted)}
.ticon{display:inline-flex;gap:6px}

dialog{border:0;border-radius:14px;padding:22px;width:min(480px,94vw)}
dialog::backdrop{background:rgba(10,26,58,.55)}
dialog h3{margin:0 0 4px}
#toast{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:340px;font-weight:600;animation:slide .25s}
.tst.warn{background:#d97706}.tst.bad{background:#dc2626}.tst.good{background:#0f8a43}
@keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

@media(max-width:1180px){.dgrid{grid-template-columns:1fr}.charts{grid-template-columns:1fr 1fr}.charts>:nth-child(2){grid-column:1/-1;order:3}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  aside.side{position:fixed;left:-260px;width:240px;z-index:20;transition:left .2s}
  aside.side.open{left:0}
  .burger{display:block}.grid2{grid-template-columns:1fr}.clock,.search{display:none}
  .content{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== reference match v4 ===== */
.app{grid-template-columns:250px 1fr}
.app.collapsed{grid-template-columns:0 1fr}.app.collapsed aside.side{display:none}
aside.side{padding:20px 16px}
.brand b{font-size:22px}.brand small{display:block;font-size:11px;opacity:.7;margin-top:2px}
nav a{padding:13px 14px;font-size:15px;border-radius:10px;gap:14px}
nav a svg{width:23px;height:23px}
nav a.ga svg{color:#fb923c}
.prof{display:flex;gap:10px;align-items:center;padding-top:14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.prof .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:grid;place-items:center;font-weight:700}
.prof b{display:block;font-size:14px}.prof small{opacity:.7;font-size:12px}
.burger{display:block}
.search{max-width:520px}.search kbd{font:inherit;font-size:12px;color:var(--muted);white-space:nowrap}
.avtop{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.clock{display:flex;gap:8px;align-items:center;text-align:left;line-height:1.25}
.clock svg{color:#64748b}
.hero h1.page{font-size:32px}
.banner{display:flex;align-items:center;gap:16px;min-width:560px;padding:14px 22px;background:linear-gradient(90deg,#10316b 0%,#1b4a8a 60%,#2c5f9c 100%)}
.banner:after{display:none}
.banner .bx{color:#fb923c;flex:none;display:grid;place-items:center}
.banner .vr{width:1px;align-self:stretch;background:rgba(255,255,255,.3)}
.banner .shelf{position:absolute;right:0;top:0;bottom:0;width:34%;opacity:.55;background:linear-gradient(90deg,#1b4a8a,transparent 45%),repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 3px,transparent 3px 18px),repeating-linear-gradient(90deg,rgba(251,146,60,.45) 0 11px,rgba(96,165,250,.4) 11px 25px,transparent 25px 31px)}
.banner>div{position:relative;z-index:1}
.dgrid{grid-template-columns:minmax(0,1fr) 330px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{border-radius:14px;padding:16px 14px;gap:12px;align-items:center}
.kpi .ic{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 14px rgba(15,31,61,.18)}
.kpi.b{background:linear-gradient(135deg,#f3f8ff,#e1ecff);border-color:#cfe0ff}.kpi.b .ic{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.kpi.g{background:linear-gradient(135deg,#f1fbf5,#ddf5e7);border-color:#c5ecd5}.kpi.g .ic{background:linear-gradient(135deg,#34d399,#12a150)}
.kpi.o{background:linear-gradient(135deg,#fff8ec,#ffecc9);border-color:#ffd99a}.kpi.o .ic{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.kpi.r{background:linear-gradient(135deg,#fff3f3,#ffdede);border-color:#ffc4c4}.kpi.r .ic{background:linear-gradient(135deg,#f87171,#dc2626)}
.kpi .v{font-size:30px}.kpi .s{font-size:12px;margin-top:2px}
.tu{color:#12a150;font-weight:600}.td{color:#dc2626;font-weight:600}.tm{color:var(--muted)}
.kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{display:flex;gap:14px;align-items:center;border-radius:14px;padding:16px 18px;border:1px solid var(--line)}
.k2 .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.k2 .l{font-weight:600;color:#475569}.k2 .v{font-size:28px;font-weight:700;line-height:1.1}.k2 .s{font-size:12px}
.k2.b{background:linear-gradient(135deg,#f3f8ff,#e6f0ff);border-color:#d6e5ff}.k2.b .ic{background:#cfe2ff;color:#2563eb}
.k2.p{background:linear-gradient(135deg,#f9f5ff,#efe6ff);border-color:#e3d5ff}.k2.p .ic{background:#e3d5ff;color:#7c3aed}
.k2.g{background:linear-gradient(135deg,#f1fbf5,#e0f6e9);border-color:#c9eedb}.k2.g .ic{background:#cdeedc;color:#12a150}
.charts{grid-template-columns:320px minmax(0,1fr) 235px}
.dwrap{display:flex;gap:14px;align-items:center}
.dwrap .donutwrap{width:118px;height:118px;margin:0;flex:none}
.dwrap .donutwrap svg{width:118px;height:118px}
.donutwrap .mid b{font-size:22px}
.dwrap .legend{flex:1;min-width:0;font-size:12.5px}.legend div{white-space:nowrap}
.alertcard.hot{animation:ring 2.2s infinite}
@keyframes ring{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 3px rgba(239,68,68,.28),var(--shadow)}}
.head.wrap{flex-wrap:wrap;gap:10px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{display:flex;gap:6px;align-items:center;border:1px solid #d6deec;border-radius:8px;padding:6px 10px;margin:0;background:#fff;font-weight:400;color:var(--muted)}
.mini input{border:0;outline:0;padding:0;width:140px;background:none}
.tools select{width:auto;padding:7px 10px}
.ab{width:28px;height:28px;border:0;border-radius:7px;cursor:pointer;display:inline-grid;place-items:center;margin-right:4px}
.ab svg{width:16px;height:16px}
.ab.in{background:#dcf7e6;color:#0f8a43}.ab.out{background:#ffe3e3;color:#c92a2a}
.tip{display:flex;align-items:center;gap:12px;background:#eaf2ff;border:1px solid #d3e3ff;border-radius:12px;padding:12px 16px;color:#1e3a8a}
.tip svg{color:#f59e0b}.tip .link{margin-left:auto}
.more{padding:10px;text-align:center;color:var(--muted)}
@media(max-width:1500px){
  .kpis,.kpis3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .charts{grid-template-columns:1fr 1fr}.charts>:nth-child(2){grid-column:1/-1;order:3}
}
@media(max-width:1180px){.dgrid{grid-template-columns:1fr}}
@media(max-width:900px){.app{grid-template-columns:1fr}.clock,.search{display:none}.banner{min-width:0;width:100%}}
@media(max-width:700px){.charts{grid-template-columns:1fr}.dwrap{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo" id="logoIc"></div>
      <div><b>Smart Stock</b><span>Office Stock System</span><small>Track · Manage · Grow</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sync-card" id="syncCard"></div>
    <div class="prof" id="prof"></div>
  </aside>

  <div>
    <div class="top">
      <button class="burger" id="burger" aria-label="Menu"></button>
      <label class="search" style="margin:0"><span id="sIc"></span><input id="gsearch" placeholder="Search by item name, ID, category..."><kbd>Ctrl + K</kbd></label>
      <div class="sp"></div>

</div>

<dialog id="itemDlg">
  <h3 id="itemTitle">Add item</h3>
  <form id="itemForm" autocomplete="off">
    <label for="iName">Item name <i>*</i></label><input id="iName" required>
    <div class="row2">
      <div><label for="iCat">Category</label><input id="iCat" placeholder="Stationery"></div>
      <div><label for="iLoc">Location</label><input id="iLoc" placeholder="A1-01"></div>
      <div><label for="iUnit">Unit</label><input id="iUnit" placeholder="Pcs"></div>

      <button class="btn" type="submit">Save item</button>
    </div>
  </form>
</dialog>
<div id="toast" aria-live="polite"></div>

<script>
(function(){
'use strict';
var KEY='smartStockOffice.v2';
var DEFAULT_URL='https://script.google.com/macros/s/AKfycbzdidfuBC6haZramKeX-qHDrjieD7rsKI0fKwhM30NYuzaFTPDOyenM2fJA2Kofm0C3/exec';
var S={items:[],log:[],url:'',alarm:false,page:'dashboard',pre:'',atab:'all',emp:'',lastSync:null,sync:'local',saving:false,q:''};
var audio=null, editId=null;
var $=function(id){return document.getElementById(id);};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var COL=['#2563eb','#12a150','#f59e0b','#8b5cf6','#ef4444','#0891b2','#64748b'];

/* ---------- icons ---------- */
var P={
 dash:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
 minus:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
 swap:'<path d="M4 8h14l-4-4M20 16H6l4 4"/>',
 bell:'<path d="M18 16v-5a6 6 0 10-12 0v5l-2 2h16l-2-2zM10 21h4"/>',
 sync:'<path d="M20 11a8 8 0 00-14-4L4 9M4 4v5h5M4 13a8 8 0 0014 4l2-2M20 20v-5h-5"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 warn:'<path d="M12 3l10 18H2L12 3zM12 10v5M12 18v.5"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
 down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 9v12"/>',
 spk:'<path d="M4 9v6h4l5 4V5L8 9H4zM17 8a5 5 0 010 8"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 dl:'<path d="M12 4v12M6 12l6 6 6-6M4 20h16"/>'
};
P.bulb='<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 00-4-10z"/>';
P.cal='<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>';
var CATCOL=['#12a150','#2563eb','#f59e0b','#8b5cf6','#64748b'];
function ic(n,s){return '<svg class="i" viewBox="0 0 24 24"'+(s?' style="width:'+s+'px;height:'+s+'px"':'')+'>'+P[n]+'</svg>';}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function p2(n){return n<10?'0'+n:''+n;}
function fd(iso){var d=new Date(iso);if(isNaN(d))return esc(iso);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+p2(d.getHours())+':'+p2(d.getMinutes());}
function ft(iso){var d=new Date(iso);return isNaN(d)?'':p2(d.getHours())+':'+p2(d.getMinutes());}
function ldt(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes());}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function find(id){return S.items.filter(function(i){return i.id===id;})[0];}
function st(i){return i.qty<=0?'out':(i.qty<=i.min?'low':((i.min>0&&i.qty>i.min*5)?'over':'ok'));}
var LBL={out:'Out of Stock',low:'Low Stock',ok:'Available',over:'Overstock'};
function nextCode(){var m=0;S.items.forEach(function(i){var n=parseInt(String(i.code).replace(/\D/g,''),10)||0;if(n>m)m=n;});return 'ITM-'+('00'+(m+1)).slice(-3);}
function fixItems(){S.items.forEach(function(i){if(!i.code)i.code=nextCode();if(!i.unit)i.unit='Pcs';if(!i.cat)i.cat='General';});}
function counts(){var c={out:0,low:0,ok:0,over:0,qty:0};S.items.forEach(function(i){c[st(i)]++;c.qty+=i.qty;});return c;}
function toast(m,k){var t=document.createElement('div');t.className='tst '+(k||'');t.textContent=m;$('toast').appendChild(t);setTimeout(function(){t.remove();},5000);}

/* ---------- storage + seed ---------- */
function persist(){try{localStorage.setItem(KEY,JSON.stringify({items:S.items,log:S.log,url:S.url,disc:S.disc,emp:S.emp,lastSync:S.lastSync}));}catch(e){}}
function seed(){
  var rows=[['A4 Paper','Stationery','A1-01','Reams',10,24],['Ball Pens','Stationery','A1-02','Pcs',20,18],['Printer Toner','Printing','B2-01','Pcs',2,0],
   ['Tea Bags','Pantry','C1-01','Boxes',3,9],['Stapler Pins','Stationery','A2-01','Boxes',5,4],['Sticky Notes','Stationery','A2-02','Pads',10,80],
   ['Hand Wash','Pantry','C2-01','Ltr',4,0],['Marker Pens','Stationery','A3-01','Pcs',12,30]];
  S.items=rows.map(function(r,n){return {id:uid()+n,code:'ITM-'+('00'+(n+1)).slice(-3),name:r[0],cat:r[1],loc:r[2],unit:r[3],min:r[4],qty:r[5]};});
  var ev=[[0,1,'IN',0,12,'Admin'],[0,3,'OUT',1,6,'Admin'],[1,2,'OUT',4,3,'Admin'],[1,5,'IN',3,4,'Admin'],[2,1,'OUT',0,10,'Admin'],[3,4,'IN',5,40,'Admin'],[4,2,'OUT',7,5,'Admin'],[5,6,'IN',1,20,'Admin'],[6,3,'OUT',2,2,'Admin']];
  var run={};S.items.forEach(function(i){run[i.id]=i.qty;});
  S.log=ev.map(function(e){var it=S.items[e[3]],d=new Date();d.setDate(d.getDate()-e[0]);d.setHours(d.getHours()-e[1]);
    var nw=run[it.id],pv=e[2]==='IN'?nw-e[4]:nw+e[4];run[it.id]=pv;
    return {time:d.toISOString(),type:e[2],code:it.code,item:it.name,qty:e[4],prev:Math.max(pv,0),now:nw,by:e[5],party:'',ref:'',note:'Sample entry'};});
}
function load(){
  var s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  if(s){S.items=s.items||[];S.log=s.log||[];S.disc=!!s.disc;S.url=s.url||(S.disc?'':DEFAULT_URL);S.emp=s.emp||'';S.lastSync=s.lastSync||null;}
  else{S.url=DEFAULT_URL;if(!S.url)seed();}
  fixItems();S.sync=S.url?'ok':'local';
}

/* ---------- Google Sheet sync ---------- */
function pull(){
  if(!S.url||S.saving) return Promise.resolve();
  return fetch(S.url).then(function(r){return r.json();}).then(function(d){
    if(S.saving) return;
    if(d.items&&d.items.length){S.items=d.items;S.log=d.log||[];}
    else if(S.items.length){push(null);}
    fixItems();S.sync='ok';S.lastSync=Date.now();persist();refresh();
  }).catch(function(){S.sync='err';chrome();});
}
function push(row){
  if(!S.url) return Promise.resolve();
  S.saving=true;
  return fetch(S.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({items:S.items,log:row})})
  .then(function(){S.sync='ok';S.lastSync=Date.now();persist();})
  .catch(function(){S.sync='err';toast('Sheet save failed. Entry is kept on this device.','bad');})
  .then(function(){chrome();setTimeout(function(){S.saving=false;},1500);});
}

/* ---------- alarm ---------- */
function beep(){
  if(!audio) return;
  [0,.25,.5].forEach(function(t){var o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+.15);});
}
function critical(){return S.items.some(function(i){var s=st(i);return s==='out'||s==='low';});}
setInterval(function(){if(S.alarm&&critical())beep();},20000);

/* ---------- chrome (sidebar/topbar) ---------- */
var NAV=[['dashboard','Dashboard','dash'],['inventory','Inventory','box'],['stockin','Stock In','plus','gi'],['stockout','Stock Out','minus','go'],['transactions','Transactions','swap'],['alerts','Alerts','bell','ga'],['sheets','Google Sheets Sync','sheet']];
function alertCount(){var c=counts();return c.out+c.low;}
function ago(){if(!S.lastSync)return 'not yet';var m=Math.round((Date.now()-S.lastSync)/60000);return m<1?'just now':m+' min ago';}
function chrome(){
  var ac=alertCount();
  $('nav').innerHTML=NAV.map(function(n){return '<a data-nav="'+n[0]+'" class="'+(n[3]||'')+(S.page===n[0]?' on':'')+'" tabindex="0">'+ic(n[2])+n[1]+(n[0]==='alerts'&&ac?'<span class="badge">'+ac+'</span>':'')+'</a>';}).join('');
  var con=!!S.url;
  $('syncCard').innerHTML='<div class="r"><span class="dot '+(S.sync==='ok'&&con?'ok':(S.sync==='err'?'err':''))+'"></span><b>'+(con?(S.sync==='err'?'Google Sheets Error':'Google Sheets Connected'):'Local only')+'</b></div>'+
    '<div style="margin-top:4px;opacity:.85">'+(con?'Last sync: '+ago():'Connect a sheet to save online')+'</div><button data-nav="sheets">'+(con?'Sync Now':'Connect')+'</button>';
  var cls=S.sync==='err'?'err':(con?'':'local');
  $('topSync').className='topsync '+cls;
  $('topSync').innerHTML='<span style="color:'+(S.sync==='err'?'#ef4444':(con?'#12a150':'#94a3b8')+'')+'">'+ic('sync',22)+'</span><div><b>'+(con?(S.sync==='err'?'Sync failed':'Sync Success'):'Local only')+'</b><small>'+(con?ago():'No sheet connected')+'</small></div>';
  $('bellBtn').innerHTML=ic('bell',22)+(ac?'<span class="n">'+ac+'</span>':'');
  $('alarmBtn').innerHTML=ic('spk',22);$('alarmBtn').classList.toggle('on',S.alarm);$('alarmBtn').setAttribute('aria-pressed',S.alarm);
  $('alarmBtn').title=S.alarm?'Alarm on (click to mute)':'Alarm off (click to turn on)';
  var d=new Date();$('clock').innerHTML=ic('cal',20)+'<div>'+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+'<br>'+p2(d.getHours())+':'+p2(d.getMinutes())+'</div>';
  var nm=S.emp||'Office Admin',ini=nm.charAt(0).toUpperCase();$('topAv').textContent=ini;
  $('prof').innerHTML='<div class="av">'+esc(ini)+'</div><div><b>'+esc(nm)+'</b><small>Administrator</small></div>';
  document.title=(ac?'('+ac+') ':'')+'Smart Stock';
}

/* ---------- pages ---------- */
function avatar(i){var c=COL[(i.cat||'x').charCodeAt(0)%COL.length];return '<span class="avatar" style="background:'+c+'">'+esc((i.name||'?').charAt(0).toUpperCase())+'</span>';}
function kpi(cls,icn,l,v,s,bar,hot){return '<div class="kpi '+cls+(bar!=null?' has-bar':'')+(hot?' hot':'')+'"><div class="ic">'+ic(icn,24)+'</div><div><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>'+(bar!=null?'<div class="bar"><i style="width:'+bar+'%;background:'+({g:'#12a150',o:'#f59e0b',r:'#ef4444'}[cls]||'#2563eb')+'"></i></div>':'')+'</div>';}
function invTable(list){
  if(!list.length) return '<div class="empty">No items found. Add your first item from Inventory.</div>';
  return '<div class="twrap"><table><thead><tr><th>Item ID</th><th>Item Name</th><th>Category</th><th>Location</th><th>Unit</th><th>Current Stock</th><th>Min Level</th><th>Status</th></tr></thead><tbody>'+
   list.map(function(i){var s=st(i);return '<tr><td>'+esc(i.code)+'</td><td>'+avatar(i)+esc(i.name)+'</td><td>'+esc(i.cat)+'</td><td>'+(esc(i.loc)||'-')+'</td><td>'+esc(i.unit)+'</td><td class="n-'+s+'">'+i.qty+'</td><td>'+i.min+'</td><td><span class="pill '+s+'">'+LBL[s]+'</span></td></tr>';}).join('')+'</tbody></table></div>';
}
function sevSort(a,b){var o={out:0,low:1,over:2,ok:3};return o[st(a)]-o[st(b)]||a.name.localeCompare(b.name);}
function filtered(){var q=S.q.toLowerCase();return S.items.filter(function(i){return !q||(i.name+' '+i.code+' '+i.cat+' '+i.loc).toLowerCase().indexOf(q)>-1;});}

function donut(parts){
  var tot=parts.reduce(function(a,p){return a+p.v;},0),off=25,h='';
  if(!tot) h='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#e7edf6" stroke-width="6"/>';
  parts.forEach(function(p){var d=tot?p.v/tot*100:0;if(d>0){h+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+p.c+'" stroke-width="6" stroke-dasharray="'+d+' '+(100-d)+'" stroke-dashoffset="'+off+'"/>';}off-=d;});
  return '<svg viewBox="0 0 42 42">'+h+'</svg>';
}
function trend(){
  var days=[],i;for(i=6;i>=0;i--){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push({k:d.toDateString(),l:d.getDate()+' '+MON[d.getMonth()],a:0,b:0});}
  S.log.forEach(function(r){var k=new Date(r.time).toDateString();days.forEach(function(d){if(d.k===k){if(r.type==='IN')d.a+=Number(r.qty);else d.b+=Number(r.qty);}});});
  var mx=Math.max.apply(null,days.map(function(d){return Math.max(d.a,d.b);}).concat([10]));
  var step=Math.pow(10,Math.floor(Math.log10(mx)));mx=Math.ceil(mx/step)*step;
  var W=560,H=210,pl=38,pr=12,pt=10,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  function X(n){return pl+n*iw/6;}function Y(v){return pt+ih*(1-v/mx);}
  var g='';for(i=0;i<=4;i++){var v=mx*i/4;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#e7edf6"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" font-size="11" text-anchor="end" fill="#64748b">'+Math.round(v)+'</text>';}
  function line(key,c,area){var pts=days.map(function(d,n){return X(n)+','+Y(d[key]);}).join(' ');
    return (area?'<polygon points="'+X(0)+','+Y(0)+' '+pts+' '+X(6)+','+Y(0)+'" fill="'+c+'" opacity=".12"/>':'')+'<polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="2.5"/>'+days.map(function(d,n){return '<circle cx="'+X(n)+'" cy="'+Y(d[key])+'" r="4" fill="#fff" stroke="'+c+'" stroke-width="2"><title>'+d.l+': '+d[key]+'</title></circle>';}).join('');}
  var lab=days.map(function(d,n){return '<text x="'+X(n)+'" y="'+(H-8)+'" font-size="11" text-anchor="middle" fill="#64748b">'+d.l+'</text>';}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Stock in and stock out for the last 7 days">'+g+line('a','#12a150',true)+line('b','#f59e0b',true)+lab+(days.every(function(d){return !d.a&&!d.b;})?'<text x="'+(W/2)+'" y="'+(H/2-10)+'" font-size="13" text-anchor="middle" fill="#94a3b8">No stock movement in the last 7 days</text>':'')+'</svg>';
}
function cats(){
  var m={},tot=0;S.items.forEach(function(i){var c=i.cat||'General';m[c]=(m[c]||0)+i.qty;tot+=i.qty;});
  var a=Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(x,y){return y[1]-x[1];}).slice(0,5);
  if(!a.length) return '<div class="empty">No data yet</div>';
  return a.map(function(r,n){var p=tot?Math.round(r[1]/tot*100):0;return '<div class="row"><div class="t"><span>'+esc(r[0])+'</span><span>'+p+'%</span></div><div class="tr"><i style="width:'+p+'%;background:'+CATCOL[n]+'"></i></div></div>';}).join('');
}
function alertItems(){return S.items.filter(function(i){return st(i)!=='ok';}).sort(sevSort);}
function aRow(i){var s=st(i);var sub=s==='out'?'Out of Stock':(s==='low'?(i.qty<i.min?'Below Minimum':'Low Stock'):'Overstock');
  return '<div class="it '+s+'"><div class="c">'+ic(s==='out'?'x':(s==='low'?'warn':'up'))+'</div><div><b>'+esc(i.name)+'</b><small>'+sub+'</small></div><div class="r">'+i.qty+' units'+(s==='over'?'':' left')+'</div></div>';}
function evRow(r){var inn=r.type==='IN',it=S.items.filter(function(x){return x.code===r.code;})[0];
  return '<div class="ev"><div class="c '+(inn?'in':'out')+'">'+ic(inn?'up':'down')+'</div><div><b>'+esc(r.item)+'</b><small>Stock '+(inn?'In':'Out')+(it&&it.loc?' · '+esc(it.loc):'')+' · '+ft(r.time)+'</small></div><div class="r"><b class="'+(inn?'in':'out')+'">'+(inn?'+':'-')+r.qty+' units</b><small>'+esc(r.by)+'</small></div></div>';}
function kpi2(cls,icn,l,v,s){return '<div class="k2 '+cls+'"><div class="ic">'+ic(icn,22)+'</div><div><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div></div>';}
function cmp(t,y){if(!y)return t?'<span class="tu">\u2191 New today</span>':'<span class="tm">No entries yesterday</span>';var p=Math.round((t-y)/y*100);return '<span class="'+(p>=0?'tu':'td')+'">'+(p>=0?'\u2191 ':'\u2193 ')+Math.abs(p)+'% vs yesterday</span>';}
function dashBody(){
  if(!$('dBody'))return;
  var q=(S.q||'').toLowerCase(),f=S.df||'',so=S.ds||'prio';
  var l=S.items.filter(function(i){return (!q||(i.name+' '+i.code+' '+i.cat+' '+i.loc).toLowerCase().indexOf(q)>-1)&&(!f||st(i)===f);});
  l.sort(so==='name'?function(a,b){return a.name.localeCompare(b.name);}:(so==='qty'?function(a,b){return a.qty-b.qty;}:sevSort));
  var total=l.length;l=l.slice(0,8);
  $('dBody').innerHTML=l.length?'<div class="twrap"><table><thead><tr><th>Item ID</th><th>Item Name</th><th>Category</th><th>Location</th><th>Unit</th><th>Current Stock</th><th>Min Level</th><th>Status</th><th>Action</th></tr></thead><tbody>'+
   l.map(function(i){var s=st(i);return '<tr><td>'+esc(i.code)+'</td><td>'+avatar(i)+esc(i.name)+'</td><td>'+esc(i.cat)+'</td><td>'+(esc(i.loc)||'-')+'</td><td>'+esc(i.unit)+'</td><td class="n-'+s+'">'+i.qty+'</td><td>'+i.min+'</td><td><span class="pill '+s+'">'+LBL[s]+'</span></td><td><button class="ab in" data-restock="'+i.id+'" title="Stock In" aria-label="Stock in '+esc(i.name)+'">'+ic('plus')+'</button><button class="ab out" data-issue="'+i.id+'" title="Stock Out" aria-label="Stock out '+esc(i.name)+'">'+ic('minus')+'</button></td></tr>';}).join('')+'</tbody></table></div>'+
   (total>8?'<div class="more">Showing 8 of '+total+' items. <button class="link" data-nav="inventory">View all</button></div>':''):
   '<div class="empty">'+(S.items.length?'No items match your search.':'No items yet. Click Add Item to start.')+'</div>';
}
function pDash(){
  var c=counts(),t=S.items.length,av=c.ok+c.over,pct=function(n){return t?Math.round(n/t*100):0;};
  var td=new Date().toDateString(),yd=new Date();yd.setDate(yd.getDate()-1);yd=yd.toDateString();
  var wk=Date.now()-7*864e5,net=0,tin=0,tout=0,tn=0,yin=0,yout=0,yn=0;

  $('inPrev').textContent=it.qty;$('inRcv').textContent=q;$('inNew').textContent=it.qty+q;$('inInfo').textContent=syncNote();

function sumOut(){
  var it=find($('outItem').value);if(!it)return;var q=parseInt($('outQty').value,10)||0,rem=it.qty-q;
  $('outAvail').value=it.qty;$('outUnit').value=it.unit;
  $('outHead').innerHTML=avatar(it)+'<div><b>'+esc(it.name)+'</b><br><small style="color:var(--muted)">'+esc(it.code)+' · min level '+it.min+'</small></div>';
  $('outCur').textContent=it.qty;$('outIss').textContent=q;$('outRem').textContent=rem;
  var r=$('outRem'),n=$('outInfo');
  if(rem<0){r.style.color='var(--red)';n.className='note bad';n.textContent='Not enough stock. Only '+it.qty+' '+it.unit+' available.';}
  else if(rem<=0){r.style.color='var(--red)';n.className='note bad';n.textContent='This will leave the item out of stock. Reorder needed.';}
  else if(rem<=it.min){r.style.color='#d97706';n.className='note warn';n.textContent='Minimum level reached. Only '+rem+' '+it.unit+' will be left (minimum '+it.min+').';}
  else{r.style.color='var(--green)';n.className='note';n.textContent=syncNote();}
}
function entry(type){
  var p=type==='IN'?'in':'out',m=$(p+'Msg'),it=find($(p+'Item').value),q=parseInt($(p+'Qty').value,10),emp=$(p+'Emp').value.trim();
  m.style.color='var(--red)';
  if(!it||!q||q<1){m.textContent='Enter a quantity of 1 or more.';return;}
  if(!emp){m.textContent='Enter the employee name.';return;}
  if(type==='OUT'&&q>it.qty){m.textContent='Only '+it.qty+' '+it.unit+' of '+it.name+' in stock. Lower the quantity.';return;}
  var dt=new Date($(p+'Dt').value);if(isNaN(dt))dt=new Date();
  var prev=it.qty;it.qty+=type==='IN'?q:-q;
  if(type==='IN'&&$('inLoc').value.trim())it.loc=$('inLoc').value.trim();
  S.emp=emp;
  var note=type==='OUT'?[$('outWhy').value.trim(),$('outNote').value.trim()].filter(Boolean).join(' - '):$('inNote').value.trim();
  var row={time:dt.toISOString(),type:type,code:it.code,item:it.name,qty:q,prev:prev,now:it.qty,by:emp,party:$(p+'Party').value.trim(),ref:$(p+'Ref').value.trim(),note:note};
  S.log.unshift(row);persist();push(row);chrome();
  var s=st(it);
  if(s==='out'){toast(it.name+' is now out of stock. Reorder needed.','bad');if(S.alarm)beep();}
  else if(s==='low'){toast('Minimum reached: only '+it.qty+' '+it.unit+' of '+it.name+' left (min '+it.min+').','warn');if(S.alarm)beep();}
  else toast('Saved. '+it.name+': '+it.qty+' '+it.unit+' now in stock.','good');
  m.style.color='var(--green)';m.textContent='Saved at '+ft(row.time)+'.';
  $(p+'Qty').value='';$(p+'Note').value='';if(type==='OUT'){$('outWhy').value='';$('outRef').value='';}else $('inRef').value='';
  $(p+'Item').innerHTML=itemOptions(it.id);
  type==='IN'?sumIn():sumOut();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-nav],[data-edit],[data-del],[data-tab],[data-restock],[data-issue],[data-dl],#addItem,#csv,#saveUrl,#syncNow,#clearAll,#alarmBig');
  if(!t) return;
  if(t.dataset.nav) return go(t.dataset.nav);
  if(t.dataset.restock) return go('stockin',t.dataset.restock);
  if(t.dataset.issue) return go('stockout',t.dataset.issue);
  if(t.dataset.dl) return t.dataset.dl==='print'?printStock():dlStock(t.dataset.dl);
  if(t.dataset.tab){S.atab=t.dataset.tab;return view();}
  if(t.dataset.edit) return openItem(t.dataset.edit);
  if(t.dataset.del){var it=find(t.dataset.del);if(it&&confirm('Delete '+it.name+'? Its past transactions stay in the log.')){S.items=S.items.filter(function(i){return i.id!==it.id;});persist();push(null);chrome();view();}return;}
  if(t.id==='addItem') return openItem(null);
  if(t.id==='alarmBig') return $('alarmBtn').click();
  if(t.id==='csv'){
    var rows=[['Time','Type','Code','Item','Qty','Previous','New','Employee','Party','Reference','Note']].concat(S.log.map(function(r){return [r.time,r.type,r.code,r.item,r.qty,r.prev,r.now,r.by,r.party,r.ref,r.note];}));
    var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='stock-transactions.csv';a.click();return;
  }
  if(t.id==='saveUrl'){S.url=$('urlIn').value.trim();S.disc=!S.url;S.sync=S.url?'ok':'local';persist();chrome();if(S.url){toast('Connecting to Google Sheet...');pull().then(function(){view();});}else{toast('Disconnected. Data stays on this device.');view();}return;}
  if(t.id==='syncNow'){if(!S.url){toast('Add the Web app URL first.','warn');return;}push(null).then(pull).then(function(){toast('Sync complete.','good');view();});return;}
  if(t.id==='clearAll'){if(confirm('Remove all items and transactions? This cannot be undone.')){S.items=[];S.log=[];persist();push(null);chrome();view();}return;}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('nav a')){e.preventDefault();e.target.click();}});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='dq'){S.q=e.target.value;$('gsearch').value=S.q;return dashBody();}
  if(id==='dfilter'){S.df=e.target.value;return dashBody();}
  if(id==='dsort'){S.ds=e.target.value;return dashBody();}
  if(id==='fq'||id==='fc'||id==='fs')return invBody();
  if(id==='inQty'||id==='inItem')return sumIn();
  if(id==='outQty'||id==='outItem')return sumOut();
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='fIn')entry('IN');
  else if(e.target.id==='fOut')entry('OUT');
  else if(e.target.id==='itemForm')saveItem();
});

/* stock download / print */
function stockRows(list){return [['Item ID','Item Name','Category','Location','Unit','Current Stock','Min Level','Status']].concat(list.map(function(i){return [i.code,i.name,i.cat,i.loc,i.unit,i.qty,i.min,LBL[st(i)]];}));}
function csvSave(name,rows){
  var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function dlStock(kind){
  var list=(kind==='alerts'?alertItems():S.items.slice().sort(sevSort));
  if(!list.length){toast(kind==='alerts'?'No alerts to download.':'No items to download.','warn');return;}
  csvSave((kind==='alerts'?'stock-alerts-':'stock-report-')+ldt(new Date()).slice(0,10)+'.csv',stockRows(list));
  toast('Downloaded. Open the CSV in Excel or Google Sheets.','good');
}
function printStock(){
  var w=window.open('','_blank');if(!w){toast('Allow pop-ups to print the report.','warn');return;}
  var c=counts(),col={out:'#c92a2a',low:'#b45309',ok:'#0f8a43',over:'#4338ca'};
  var rows=S.items.slice().sort(sevSort).map(function(i){var s=st(i);return '<tr><td>'+esc(i.code)+'</td><td>'+esc(i.name)+'</td><td>'+esc(i.cat)+'</td><td>'+(esc(i.loc)||'-')+'</td><td>'+esc(i.unit)+'</td><td style="color:'+col[s]+';font-weight:700">'+i.qty+'</td><td>'+i.min+'</td><td style="color:'+col[s]+'">'+LBL[s]+'</td></tr>';}).join('');
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Stock Report</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:28px;color:#0f1f3d}h2{margin:0}p{color:#64748b;margin:4px 0 16px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#eef2f9;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid #e3e9f3}</style></head><body><h2>Stock Report</h2><p>'+fd(new Date().toISOString())+' · '+S.items.length+' items · '+c.low+' low · '+c.out+' out of stock</p><table><thead><tr><th>Item ID</th><th>Item Name</th><th>Category</th><th>Location</th><th>Unit</th><th>Current Stock</th><th>Min Level</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>');
  w.document.close();w.focus();setTimeout(function(){w.print();},300);
}

/* item dialog */
function openItem(id){
  editId=id;var it=id?find(id):null;
  $('itemTitle').textContent=it?'Edit item':'Add item';
  $('iName').value=it?it.name:'';$('iCat').value=it?it.cat:'';$('iLoc').value=it?it.loc:'';$('iUnit').value=it?it.unit:'';$('iMin').value=it?it.min:5;
  $('iQty').value=it?it.qty:0;$('iQty').readOnly=!!it;$('iQtyL').textContent=it?'Current stock (change it with Stock In or Stock Out)':'Opening stock';
  $('itemDlg').showModal();
}
function saveItem(){
  var o={name:$('iName').value.trim(),cat:$('iCat').value.trim()||'General',loc:$('iLoc').value.trim(),unit:$('iUnit').value.trim()||'Pcs',min:parseInt($('iMin').value,10)||0};
  if(editId){var it=find(editId);Object.keys(o).forEach(function(k){it[k]=o[k];});}
  else{o.id=uid();o.code=nextCode();o.qty=parseInt($('iQty').value,10)||0;S.items.push(o);}
  persist();push(null);$('itemDlg').close();chrome();view();toast('Item saved.','good');
}
$('itemCancel').addEventListener('click',function(){$('itemDlg').close();});

$('burger').innerHTML=ic('menu',26);$('sIc').innerHTML=ic('search',18);
$('logoIc').innerHTML=ic('box',24);
$('burger').addEventListener('click',function(){if(window.innerWidth>900)document.querySelector('.app').classList.toggle('collapsed');else $('side').classList.toggle('open');});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('gsearch').focus();}});
$('bellBtn').addEventListener('click',function(){go('alerts');});
$('alarmBtn').addEventListener('click',function(){
  S.alarm=!S.alarm;
  if(S.alarm){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();beep();toast('Alarm on. It sounds every 20 seconds while stock is low or out.');}
  chrome();if(S.page==='alerts')view();
});
$('gsearch').addEventListener('input',function(){S.q=this.value;if(S.page!=='dashboard'&&S.page!=='inventory'){go('inventory');}if(S.page==='dashboard'){$('dq').value=S.q;dashBody();}if(S.page==='inventory'){$('fq').value=S.q;invBody();}});

/* ---------- start ---------- */
load();chrome();view();
if(S.url)pull();
setInterval(pull,30000);
setInterval(chrome,30000);
})();
</script>
